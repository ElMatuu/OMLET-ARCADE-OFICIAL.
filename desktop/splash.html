<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Omlet Arcade</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:radial-gradient(ellipse at 50% 43%,#172c52 0%,#0d1931 42%,#060913 100%);color:#fff;font-family:Segoe UI,Arial,sans-serif}
main{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
img{width:116px;height:116px;object-fit:contain;filter:drop-shadow(0 12px 28px rgba(245,104,68,.3))}
h1{font-size:25px;letter-spacing:.19em;margin:0;font-weight:900;background:linear-gradient(90deg,#fff,#ffcfad,#c9c5ff);color:transparent;background-clip:text}
p{font-size:12px;color:#a8b0c2;margin:0;letter-spacing:.08em}
.track{width:180px;height:3px;background:#202638;border-radius:99px;overflow:hidden;margin-top:12px}
.track:after{content:"";display:block;height:100%;width:40%;background:linear-gradient(90deg,#58d8e8,#ff9b55,#b78aff);border-radius:99px;animation:load 1.3s ease-in-out infinite}
@keyframes load{0%{transform:translateX(-110%)}100%{transform:translateX(360%)}}
@media(prefers-reduced-motion:reduce){.track:after{animation:none;width:100%}}
</style>
</head>
<body><main><img src="../assets/playverse-icon.png" alt="Omlet Arcade"><h1>Omlet Arcade</h1><p>Preparando tu espacio gamer…</p><div class="track" aria-hidden="true"></div></main></body>
</html>
