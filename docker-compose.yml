services:
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    command: ["mongod", "--bind_ip_all", "--auth"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?Set MONGO_ROOT_USERNAME in .env.selfhost}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in .env.selfhost}
      MONGO_APP_USERNAME: ${MONGO_APP_USERNAME:?Set MONGO_APP_USERNAME in .env.selfhost}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?Set MONGO_APP_PASSWORD in .env.selfhost}
    volumes:
      - playverse_mongo_data:/data/db
      - ./docker/mongo-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [playverse]

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGODB_URI: mongodb://${MONGO_APP_USERNAME}:${MONGO_APP_PASSWORD}@mongo:27017/playverse?authSource=playverse
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env.selfhost}
      CORS_ORIGIN: ${CORS_ORIGIN:?Set CORS_ORIGIN in .env.selfhost}
      LIVEKIT_URL: ${LIVEKIT_URL:?Set LIVEKIT_URL in .env.selfhost}
      LIVEKIT_INTERNAL_URL: http://livekit:7880
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?Set LIVEKIT_API_KEY in .env.selfhost}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?Set LIVEKIT_API_SECRET in .env.selfhost}
    depends_on:
      mongo:
        condition: service_healthy
      livekit:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [playverse]

  livekit:
    image: livekit/livekit-server:v1.9.0
    restart: unless-stopped
    command: ["--config", "/etc/livekit.yaml"]
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:?Set LIVEKIT_API_KEY in .env.selfhost}: ${LIVEKIT_API_SECRET:?Set LIVEKIT_API_SECRET in .env.selfhost}"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "7881:7881/tcp"
      - "3478:3478/udp"
      - "50000-50100:50000-50100/udp"
      - "50101-50200:50101-50200/udp"
    expose:
      - "7880"
    networks: [playverse]

  minecraft-java:
    image: itzg/minecraft-server:java21
    profiles: ["game-servers"]
    restart: unless-stopped
    tty: true
    stdin_open: true
    environment:
      EULA: ${MINECRAFT_EULA:-FALSE}
      TYPE: PAPER
      VERSION: ${MINECRAFT_JAVA_VERSION:-LATEST}
      MEMORY: ${MINECRAFT_JAVA_MEMORY:-2G}
      MAX_PLAYERS: ${MINECRAFT_JAVA_MAX_PLAYERS:-20}
      MOTD: "Omlet Arcade · Servidor Java"
    ports:
      - "${MINECRAFT_JAVA_PORT:-25565}:25565/tcp"
    volumes:
      - omlet_minecraft_java_data:/data
    mem_limit: ${MINECRAFT_JAVA_MEMORY_LIMIT:-3g}
    stop_grace_period: 1m
    networks: [playverse]

  minecraft-bedrock:
    image: itzg/minecraft-bedrock-server:latest
    profiles: ["game-servers"]
    restart: unless-stopped
    environment:
      EULA: ${MINECRAFT_EULA:-FALSE}
      SERVER_NAME: "Omlet Arcade · Servidor Bedrock"
      GAMEMODE: ${MINECRAFT_BEDROCK_GAMEMODE:-survival}
      DIFFICULTY: ${MINECRAFT_BEDROCK_DIFFICULTY:-normal}
      MAX_PLAYERS: ${MINECRAFT_BEDROCK_MAX_PLAYERS:-20}
      VERSION: ${MINECRAFT_BEDROCK_VERSION:-LATEST}
    ports:
      - "${MINECRAFT_BEDROCK_PORT:-19132}:19132/udp"
    volumes:
      - omlet_minecraft_bedrock_data:/data
    mem_limit: ${MINECRAFT_BEDROCK_MEMORY_LIMIT:-2g}
    stop_grace_period: 1m
    networks: [playverse]

  caddy:
    image: caddy:2.8
    restart: unless-stopped
    environment:
      API_DOMAIN: ${API_DOMAIN:?Set API_DOMAIN in .env.selfhost}
      LIVE_DOMAIN: ${LIVE_DOMAIN:?Set LIVE_DOMAIN in .env.selfhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - playverse_caddy_data:/data
      - playverse_caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      livekit:
        condition: service_started
    networks: [playverse]

volumes:
  playverse_mongo_data:
  playverse_caddy_data:
  playverse_caddy_config:
  omlet_minecraft_java_data:
  omlet_minecraft_bedrock_data:

networks:
  playverse:
    driver: bridge
