services:
  mongo-keyfile-init:
    image: alpine:3.20
    restart: "no"
    command:
      - sh
      - -ec
      - |
        mkdir -p /keydata
        if [ ! -s /keydata/mongo-keyfile ]; then
          head -c 756 /dev/urandom | base64 | tr -d '\n' > /keydata/mongo-keyfile
        fi
        chown 999:999 /keydata/mongo-keyfile
        chmod 0400 /keydata/mongo-keyfile
    volumes:
      - playverse_mongo_keyfile:/keydata

  mongo:
    image: mongo:7.0
    restart: unless-stopped
    command: ["mongod", "--bind_ip_all", "--auth", "--replSet", "rs0", "--keyFile", "/run/secrets/mongo-keyfile"]
    depends_on:
      mongo-keyfile-init:
        condition: service_completed_successfully
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?Set MONGO_ROOT_USERNAME in .env.selfhost}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in .env.selfhost}
      MONGO_APP_USERNAME: ${MONGO_APP_USERNAME:?Set MONGO_APP_USERNAME in .env.selfhost}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?Set MONGO_APP_PASSWORD in .env.selfhost}
    volumes:
      - playverse_mongo_data:/data/db
      - playverse_mongo_keyfile:/run/secrets:ro
      - ./docker/mongo-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --username "$$MONGO_INITDB_ROOT_USERNAME"
          --password "$$MONGO_INITDB_ROOT_PASSWORD"
          --authenticationDatabase admin
          --eval "db.adminCommand('ping').ok" | grep -q 1
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [playverse]

  mongo-init-replica-set:
    image: mongo:7.0
    restart: "no"
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGO_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?Set MONGO_ROOT_USERNAME in .env.selfhost}
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in .env.selfhost}
    entrypoint: ["/bin/bash", "/scripts/init-replica-set.sh"]
    volumes:
      - ./docker/mongo-init-replica-set.sh:/scripts/init-replica-set.sh:ro
    networks: [playverse]

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    volumes:
      - playverse_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [playverse]

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGODB_URI: mongodb://${MONGO_APP_USERNAME}:${MONGO_APP_PASSWORD}@mongo:27017/playverse?authSource=playverse&replicaSet=rs0&retryWrites=true&w=majority
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env.selfhost}
      CORS_ORIGIN: ${CORS_ORIGIN:?Set CORS_ORIGIN in .env.selfhost}
      LIVEKIT_URL: ${LIVEKIT_URL:?Set LIVEKIT_URL in .env.selfhost}
      LIVEKIT_INTERNAL_URL: http://livekit:7880
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?Set LIVEKIT_API_KEY in .env.selfhost}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?Set LIVEKIT_API_SECRET in .env.selfhost}
      STREAM_KEY_ENCRYPTION_KEY: ${STREAM_KEY_ENCRYPTION_KEY:-}
      LIVEKIT_RECORDING_S3_BUCKET: ${LIVEKIT_RECORDING_S3_BUCKET:-}
      LIVEKIT_RECORDING_S3_ACCESS_KEY: ${LIVEKIT_RECORDING_S3_ACCESS_KEY:-}
      LIVEKIT_RECORDING_S3_SECRET: ${LIVEKIT_RECORDING_S3_SECRET:-}
      LIVEKIT_RECORDING_S3_REGION: ${LIVEKIT_RECORDING_S3_REGION:-}
      LIVEKIT_RECORDING_S3_ENDPOINT: ${LIVEKIT_RECORDING_S3_ENDPOINT:-}
      LIVEKIT_RECORDING_S3_FORCE_PATH_STYLE: ${LIVEKIT_RECORDING_S3_FORCE_PATH_STYLE:-false}
    depends_on:
      redis:
        condition: service_healthy
      mongo-init-replica-set:
        condition: service_completed_successfully
      livekit-egress:
    image: livekit/egress:v1.9.0
    restart: unless-stopped
    environment:
      EGRESS_CONFIG_FILE: /etc/egress.yaml
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?Set LIVEKIT_API_KEY in .env.selfhost}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?Set LIVEKIT_API_SECRET in .env.selfhost}
    volumes:
      - ./egress.yaml:/etc/egress.yaml:ro
    shm_size: 1gb
    depends_on:
      redis:
        condition: service_healthy
      livekit:
        condition: service_started
    networks: [playverse]

  livekit:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [playverse]

  livekit:
    image: livekit/livekit-server:v1.9.0
    restart: unless-stopped
    command: ["--config", "/etc/livekit.yaml"]
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:?Set LIVEKIT_API_KEY in .env.selfhost}: ${LIVEKIT_API_SECRET:?Set LIVEKIT_API_SECRET in .env.selfhost}"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "7881:7881/tcp"
      - "3478:3478/udp"
      - "50000-50100:50000-50100/udp"
      - "50101-50200:50101-50200/udp"
    expose:
      - "7880"
    networks: [playverse]

  caddy:
    image: caddy:2.8
    restart: unless-stopped
    environment:
      API_DOMAIN: ${API_DOMAIN:?Set API_DOMAIN in .env.selfhost}
      LIVE_DOMAIN: ${LIVE_DOMAIN:?Set LIVE_DOMAIN in .env.selfhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - playverse_caddy_data:/data
      - playverse_caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      livekit:
        condition: service_started
    networks: [playverse]

volumes:
  playverse_redis_data:
  playverse_mongo_data:
  playverse_mongo_keyfile:
  playverse_caddy_data:
  playverse_caddy_config:

networks:
  playverse:
    driver: bridge
