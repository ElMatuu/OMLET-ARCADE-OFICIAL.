name: PLAYVERSE quality checks

on:
  push:
    branches:
      - main
      - feat/playverse-brand-foundation
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        command: mongod --replSet rs0 --bind_ip_all
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok || quit(1)'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Initialize isolated MongoDB replica set
        run: |
          MONGO_CONTAINER="$(docker ps -q --filter 'ancestor=mongo:7' | head -n 1)"
          test -n "$MONGO_CONTAINER"
          docker exec "$MONGO_CONTAINER" mongosh --quiet --eval "rs.initiate({_id:'rs0',members:[{_id:0,host:'127.0.0.1:27017'}]})"
          for attempt in $(seq 1 30); do
            if docker exec "$MONGO_CONTAINER" mongosh --quiet --eval "db.hello().isWritablePrimary" | grep -q true; then
              exit 0
            fi
            sleep 2
          done
          echo "MongoDB replica set did not become primary"
          exit 1
      - name: Check JavaScript syntax
        run: npm run check:syntax
      - name: Check JSON configuration
        run: npm run check:config
      - name: Validate self-hosted Docker Compose stack
        run: |
          printf '%s\n' \
            'JWT_SECRET=ci-only-secret-value-at-least-64-characters-long-000000000000000000' \
            'LIVEKIT_API_KEY=ci-playverse-key' \
            'LIVEKIT_API_SECRET=ci-only-livekit-secret-00000000000000000000000000000000' \
            'MONGO_ROOT_USERNAME=playverse_ci' \
            'MONGO_ROOT_PASSWORD=ci-only-password-1234567890' \
            'MONGO_APP_USERNAME=playverse_ci_app' \
            'MONGO_APP_PASSWORD=ci-only-app-password-1234567890' \
            'API_DOMAIN=api.example.com' \
            'LIVE_DOMAIN=live.example.com' \
            'LIVEKIT_URL=wss://live.example.com' \
            'CORS_ORIGIN=https://api.example.com' > .env.selfhost
          docker compose --env-file .env.selfhost config --quiet
      - name: Smoke test authenticated self-hosted MongoDB replica set and transactions
        run: |
          cleanup() {
            status=$?
            if [ "$status" -ne 0 ]; then
              docker compose --env-file .env.selfhost logs --no-color mongo mongo-init-replica-set || true
            fi
            docker compose --env-file .env.selfhost down --volumes --remove-orphans
            return "$status"
          }
          trap cleanup EXIT
          docker compose --env-file .env.selfhost up -d mongo-init-replica-set
          mongo_init_container="$(docker compose --env-file .env.selfhost ps -aq mongo-init-replica-set)"
          test -n "$mongo_init_container"
          test "$(docker wait "$mongo_init_container")" = "0"
          docker compose --env-file .env.selfhost exec -T mongo bash -lc 'mongosh --quiet --username "$MONGO_APP_USERNAME" --password "$MONGO_APP_PASSWORD" --authenticationDatabase playverse --eval "
            const hello = db.hello();
            if (!hello.isWritablePrimary || hello.setName !== \"rs0\") quit(2);
            const database = db.getSiblingDB(\"playverse\");
            const collection = database.getCollection(\"__pv_transaction_smoke\");
            collection.createIndex({marker: 1});
            const marker = \"ci-\" + new Date().getTime();
            const session = db.getMongo().startSession();
            const txdb = session.getDatabase(\"playverse\");
            session.startTransaction();
            txdb.getCollection(\"__pv_transaction_smoke\").insertOne({marker});
            session.commitTransaction();
            session.endSession();
            collection.deleteOne({marker});
          "'
      - name: Run unit and multi-user integration tests
        run: npm test
        env:
          PLAYVERSE_TEST_MONGODB_URI: mongodb://127.0.0.1:27017/playverse_ci?replicaSet=rs0
      - name: Verify web update assets are packaged
        run: test -s www/service-worker.js && test -s www/app-update.js && test -s www/manifest.webmanifest && test -s www/config.js && test -s www/styles.css
