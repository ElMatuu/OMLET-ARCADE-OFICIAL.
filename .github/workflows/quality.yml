name: PLAYVERSE quality checks

on:
  push:
    branches:
      - main
      - feat/playverse-brand-foundation
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok || quit(1)'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      PLAYVERSE_TEST_MONGODB_URI: mongodb://127.0.0.1:27017/playverse_ci
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check JavaScript syntax
        run: npm run check:syntax
      - name: Check JSON configuration
        run: npm run check:config
      - name: Run unit and multi-user integration tests
        run: npm test
      - name: Verify web update assets are packaged
        run: test -s www/service-worker.js && test -s www/app-update.js && test -s www/manifest.webmanifest && test -s www/styles.css
