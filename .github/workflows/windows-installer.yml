name: PLAYVERSE Windows installer

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playverse-windows-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: D:/a/playverse-source
    steps:
      - name: Check out source into a Windows-safe directory
        shell: pwsh
        working-directory: D:/a
        run: |
          $branch = if ($env:GITHUB_HEAD_REF) { $env:GITHUB_HEAD_REF } else { $env:GITHUB_REF_NAME }
          git clone --depth 1 --branch $branch https://github.com/$env:GITHUB_REPOSITORY.git D:/a/playverse-source

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate project configuration
        run: npm run check:config

      - name: Build Windows installer
        run: npm run build:win

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: PLAYVERSE-Windows-installer
          path: D:/a/playverse-source/release/*.exe
          if-no-files-found: error
          retention-days: 14
